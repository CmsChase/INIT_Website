name: INIT Daily reviewed correction

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Edit the existing November 22 message with the reviewed preview'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: init-daily

jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - name: Download the reviewed preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45003254826 --repo "$GITHUB_REPOSITORY" --name init-daily-preview-45003254826-1 --dir output/correction-source
      - run: python -m init_daily.correction --plan corrections/2026-11-22.json --preview-dir output/correction-source

  edit:
    needs: validate
    if: inputs.apply && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Only init-daily-state is written by GitHistory.
      actions: read
    concurrency:
      group: init-daily-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Download the reviewed preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45003254826 --repo "$GITHUB_REPOSITORY" --name init-daily-preview-45003254826-1 --dir output/correction-source
      - name: Edit the exact stored message and confirm its ID
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m init_daily.correction --plan corrections/2026-11-22.json --preview-dir output/correction-source --apply
