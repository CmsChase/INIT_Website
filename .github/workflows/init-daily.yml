name: INIT Daily

on:
  schedule:
    # 01:15 UTC = 09:15 Asia/Shanghai, year-round.
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no Discord post or history writes)'
        type: boolean
        default: true
      no_ai:
        description: 'Use free rule-based fallback instead of DeepSeek'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['init-daily/**', '.github/workflows/init-daily.yml']
  pull_request:
    paths: ['init-daily/**', '.github/workflows/init-daily.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: init-daily

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: init-daily/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m init_daily --fixture fixtures --dry-run

  preview:
    needs: test
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (vars.INIT_DAILY_PUBLISH_ENABLED != 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: init-daily-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # Read-only token for fetching history, including private repos.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: init-daily/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Prepare preview with read-only history access
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          INIT_DAILY_PUBLISH_ENABLED: 'false'
          NO_AI: ${{ inputs.no_ai || false }}
        run: |
          args=(--git-state --dry-run)
          if [[ "$NO_AI" == "true" ]]; then
            args+=(--no-ai)
          fi
          python -m init_daily "${args[@]}"
      - name: Save preview and run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: init-daily-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: init-daily/output/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: test
    # No write token or Discord secret is available to the preview/test jobs.
    if: >-
      vars.INIT_DAILY_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub scopes contents permission to the repo, not an individual branch.
      # The publisher's Git code writes only refs/heads/init-daily-state.
      contents: write
    concurrency:
      group: init-daily-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: init-daily/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Publish only after the explicit repository variable gate
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INIT_DAILY_PUBLISH_ENABLED: 'true'
          NO_AI: ${{ inputs.no_ai || false }}
        run: |
          args=(--git-state --publish)
          if [[ "$NO_AI" == "true" ]]; then
            args+=(--no-ai)
          fi
          python -m init_daily "${args[@]}"
      - name: Save preview and run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: init-daily-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: init-daily/output/
          if-no-files-found: ignore
          retention-days: 14
