[briefing]
timezone = "Asia/Shanghai"
lookback_hours = 48
min_stories = 3
max_stories = 5
max_per_source = 2
max_research_stories = 2
candidate_limit = 20
min_score = 3.0
history_path = ".state/history.json"
output_dir = "output"

[deepseek]
# Official OpenAI-compatible endpoint; no proxy or third-party gateway.
# Verified 2026-11-11: https://api-docs.deepseek.com/ (DeepSeek-V4.1-Flash-1017).
model = "deepseek-flash"
max_tokens = 2200
timeout_seconds = 60

[http]
timeout_seconds = 20
retries = 2
max_feed_bytes = 5000000
max_enrichments_per_source = 4

[[sources]]
id = "openai"
name = "OpenAI"
url = "https://openai.com/news/rss.xml"
allowed_hosts = ["openai.com"]
weight = 1.5

[[sources]]
id = "deepmind"
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
allowed_hosts = ["deepmind.google", "blog.google"]
weight = 1.5

[[sources]]
id = "huggingface"
name = "Hugging Face"
url = "https://huggingface.co/blog/feed.xml"
allowed_hosts = ["huggingface.co"]
weight = 1.3
excerpt_adapter = "huggingface_markdown"

[[sources]]
id = "github"
name = "GitHub AI & ML"
url = "https://github.blog/ai-and-ml/feed/"
allowed_hosts = ["github.blog"]
weight = 1.2

[[sources]]
id = "transformers"
name = "Transformers releases"
url = "https://github.com/huggingface/transformers/releases.atom"
allowed_hosts = ["github.com"]
category = "open_source"
weight = 1.0

[[sources]]
id = "arxiv-ai"
name = "arXiv cs.AI (preprints)"
url = "https://rss.arxiv.org/rss/cs.AI"
allowed_hosts = ["arxiv.org", "export.arxiv.org"]
category = "research"
weight = 0.6

[[sources]]
id = "arxiv-robotics"
name = "arXiv cs.RO (preprints)"
url = "https://rss.arxiv.org/rss/cs.RO"
allowed_hosts = ["arxiv.org", "export.arxiv.org"]
category = "robotics"
weight = 0.8
