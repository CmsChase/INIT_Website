[briefing]
timezone = "Asia/Shanghai"
lookback_hours = 72
# Aim for 3-5; allow a shorter meaningful briefing instead of padding a quiet day.
min_stories = 1
max_stories = 5
# Soft company variety is preferred; significant same-company stories stay eligible.
max_per_source = 5
max_research_stories = 1
candidate_limit = 20
min_score = 7.0
history_path = ".state/history.json"
output_dir = "output"

[deepseek]
# Verified 2026-11-11 against https://api-docs.deepseek.com/.
model = "deepseek-flash"
max_tokens = 2200
timeout_seconds = 60

[http]
# Bounded collection across a broader source list still fits the Actions timeout.
timeout_seconds = 12
retries = 1
max_feed_bytes = 5000000
max_enrichments_per_source = 4

[[sources]]
id = "openai"
name = "OpenAI"
url = "https://openai.com/news/rss.xml"
allowed_hosts = ["openai.com"]
tier = "official"
company = "openai"
weight = 1.5

[[sources]]
id = "deepmind"
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
allowed_hosts = ["deepmind.google", "blog.google"]
tier = "official"
company = "google"
weight = 1.5

